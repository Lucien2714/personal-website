# Builds the production images and pushes them to GitHub Container Registry.
#
# The server does not build. `next build` peaks at roughly 1.9 GB of RAM, which
# a small VPS does not have spare, and the failure mode is an out-of-memory kill
# with no useful message. A GitHub runner has the headroom, fails loudly when
# something is wrong, and turns a deploy into a pull.
#
# Two images come out of one Dockerfile:
#
#   :latest        the runtime image - the standalone server and nothing else
#   :latest-tools  dependencies plus the source tree, used by the `migrate`
#                  service to apply migrations and run one-off scripts
#
# Both are also tagged with the commit SHA, so a bad deploy can be rolled back
# to a known-good build by setting IMAGE_TAG on the server.

name: Publish images

on:
  push:
    branches: [main]
  # Lets a rebuild be triggered without an empty commit.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lower-cased at use: GHCR rejects capitals, and the owner here has them.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      # Required to push to GHCR. No secret needs configuring: GITHUB_TOKEN
      # carries this permission for the repository's own package.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Lower-case the image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The tools image is built first because the runtime image reuses its
      # layers; doing it in this order means the second build is mostly cache.
      - name: Build and push the tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: tools
          # linux/amd64 only. Adding arm64 would mean emulating a Next.js build
          # under QEMU, which takes long enough to change how often you deploy.
          # If the server is ARM, add `linux/arm64` here and expect a slow job.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest-tools
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}-tools
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Images pushed"
            echo
            echo '```'
            echo "${REGISTRY}/${NAME}:latest"
            echo "${REGISTRY}/${NAME}:latest-tools"
            echo "${REGISTRY}/${NAME}:${SHA}"
            echo '```'
            echo
            echo "Deploy with:"
            echo
            echo '```bash'
            echo "docker compose pull && docker compose up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          NAME: ${{ steps.image.outputs.name }}
          SHA: ${{ github.sha }}
