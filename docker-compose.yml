# Production stack for a single VPS.
#
#   cp .env.example .env        # then fill in real values
#   docker compose pull         # images are built by CI, not here
#   docker compose up -d
#
# Images come from a registry. Building Next.js peaks at roughly 1.9 GB of RAM,
# which a small VPS does not have to spare - it serves the site in a fraction of
# that - and an out-of-memory kill mid-build is a confusing way to find out. So
# .github/workflows/publish.yml builds and pushes on every push to main, and the
# server only ever pulls.
#
# The `build:` keys are kept anyway, so that `docker compose build` still works
# on a development machine and so this file remains a complete description of
# how each image is produced.
#
# This file lives at the repository root, not beside the Dockerfile, because
# Compose resolves `${VAR}` substitutions from a `.env` in the *directory
# containing the compose file*. That is a different mechanism from the
# `env_file:` key below, and it does not read it. With the compose file in
# docker/, the two would need separate .env files whose contents had to agree,
# and the day they stopped agreeing would be a confusing one to debug.
#
# Four services: a one-shot migration job, the app, Postgres, and Caddy as the
# TLS-terminating reverse proxy. Caddy is included because obtaining and
# renewing a certificate is otherwise the one manual step that gets forgotten;
# it does that automatically from the domain name in docker/Caddyfile.
#
# Only Caddy publishes ports. Postgres and the app are reachable on the
# internal network alone, so neither is exposed to the internet even if the
# host firewall is misconfigured.

name: personal-website

services:
  # One-shot: applies pending migrations, then exits. The app waits for it to
  # succeed, so the schema and the code that expects it can never be a version
  # apart - the failure mode that produces 500s five minutes after a deploy.
  #
  # It runs from the builder stage because that is where the complete
  # dependency tree lives; the runtime image carries only the server bundle.
  #
  # This is also the service used to run one-off project scripts, as
  # `docker compose run --rm migrate npx tsx <script>` - seeding, the Jekyll
  # import, a password reset. Those scripts import src/lib/env.ts, which
  # validates the *whole* environment at import time, so this service needs the
  # same env_file the app does. `prisma migrate deploy` alone would not.
  migrate:
    image: ${IMAGE_REPO:-ghcr.io/lucien2714/personal-website}:${IMAGE_TAG:-latest}-tools
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tools
    command: npx prisma migrate deploy
    restart: 'no'
    env_file:
      - .env
    environment:
      # Overrides whatever .env says: inside the network the database is
      # reachable by service name, not on localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-website}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-personal_website}?schema=public
      UPLOAD_DIR: /app/public/uploads
    volumes:
      # Mounted so that scripts writing media (the Jekyll import) put files
      # where the app will serve them from.
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  app:
    image: ${IMAGE_REPO:-ghcr.io/lucien2714/personal-website}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # Overrides whatever .env says: inside the network the database is
      # reachable by service name, not on localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-website}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-personal_website}?schema=public
      UPLOAD_DIR: /app/public/uploads
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-website}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-personal_website}
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=und --encoding=UTF8'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Nightly dumps land here; see docs/deployment.md for the cron entry.
      - ./docker/backups:/backups
    networks:
      - internal
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-website} -d ${POSTGRES_DB:-personal_website}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      # Set SITE_DOMAIN in .env, e.g. lucien2714.com
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
